
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Highly Available Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 650px;
      margin: auto;
      padding: 35px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px #0001;
    }
    h1 { color: #e47911; }
    .status { color: #15803d; font-weight: bold; }
    .server {
      margin-top: 24px;
      padding: 14px;
      background: #e2e8f0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AWS High Availability Project</h1>
    <h2>Welcome to our 3-Tier Web Application</h2>
    <p class="status">Application is running successfully!</p>
    <p>Web Tier: Application Load Balancer</p>
    <p>Application Tier: EC2 Auto Scaling</p>
    <p>Database Tier: Private Database</p>
    <div class="server">
      <strong>Application Server:</strong>
      <span id="server">Local Development</span>
    </div>
  </div>
</body>
</html>
